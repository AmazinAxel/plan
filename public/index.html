<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"/>
  <title>Plan</title>
  <link rel="icon" type="image/png" href="/planning.png"/>
  <!-- Preloaded rather than discovered from CSS: reveal() in app.js holds the
       first paint until they are in, and a dialog (display:none until opened)
       never marks a font as used, so its first open would otherwise swap fonts
       mid-paint. -->
  <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/fonts/hammersmith-one-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body data-mode="normal" data-view="multi">
  <header id="topbar">
    <button type="button" id="m-palette"><span id="m-plan-name">Plan</span></button>
    <div id="actions">
    <button type="button" data-act="undo" class="icon" aria-label="Undo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 14 4 9 9 4"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
    </button>
    <button type="button" data-act="redo" id="m-redo" class="icon" aria-label="Redo" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 14 20 9 15 4"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
    </button>
    <button type="button" data-act="new-list" class="icon" aria-label="New list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" data-act="view" id="m-view" class="icon" aria-label="Toggle view">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h12v12H9zM15 9V3H3v12h6"/></svg>
    </button>
    </div>
  </header>

  <main id="board" tabindex="-1"></main>

  <nav id="dots" hidden></nav>

  <dialog id="palette">
    <form method="dialog">
      <input type="text" id="palette-input" autocomplete="off" placeholder="Search"/>
      <ul id="palette-list"></ul>
    </form>
  </dialog>

  <dialog id="confirm">
    <form method="dialog" id="confirm-form">
      <p id="confirm-text"></p>
      <button type="submit" class="confirm-btn">Confirm</button>
    </form>
  </dialog>

  <dialog id="bg">
    <form method="dialog" id="bg-form">
      <input type="url" id="bg-input" autocomplete="off" placeholder="Background image URL"/>
      <button type="submit" class="confirm-btn">Confirm</button>
    </form>
  </dialog>

  <dialog id="img-view">
    <div id="img-view-wrap"><img id="img-view-img" alt=""/></div>
    <div id="img-actions">
      <button type="button" id="img-open">Open in new tab</button>
      <button type="button" id="img-del">Delete image</button>
    </div>
  </dialog>

  <!-- async: drag is never needed for the first paint, so this must not hold
       up app.js (as defer would). app.js attaches drag once it loads. -->
  <script src="/Sortable.min.js" id="sortable-js" async></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
